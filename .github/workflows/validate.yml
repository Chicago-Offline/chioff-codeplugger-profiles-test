name: Validate profiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profiles
        uses: actions/checkout@v4

      - name: Check out Codeplugger contract
        uses: actions/checkout@v4
        with:
          repository: Chicago-Offline/codeplugger
          ref: 35d509b3e310deebe434826dbdcc2c8a40b31e3f
          path: codeplugger

      - name: Check out SSRF-Lite
        uses: actions/checkout@v4
        with:
          repository: Chicago-Offline/ssrf-lite
          path: ssrf-lite

      - name: Check out reference overlay
        uses: actions/checkout@v4
        with:
          repository: Chicago-Offline/chioff-ssrf-private
          path: chioff-ssrf-private

      - name: Check out shared ChiOff overlay
        uses: actions/checkout@v4
        with:
          repository: Chicago-Offline/chioff-ssrf-shared
          ref: 64e0e49e21bf1c4cb44e9927940cbfdc9edff59f
          path: chioff-ssrf-shared

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Codeplugger
        run: uv sync --directory codeplugger --locked

      - name: Validate DM-32 reference profile
        run: >-
          codeplugger/.venv/bin/codeplugger-profile
          profiles/baofeng_dm32/reference.yml
          --ssrf-root ssrf-lite/ssrf
          --ssrf-root chioff-ssrf-private/ssrf
          --radio-root codeplugger/radios

      - name: Validate ChiOff P4 profiles
        run: >-
          for profile in profiles/retevis_matetalk_p4/*.yml; do
            codeplugger/.venv/bin/codeplugger-profile "$profile"
            --ssrf-root ssrf-lite/ssrf
            --ssrf-root chioff-ssrf-shared/ssrf
            --radio-root codeplugger/radios
            --instance-registry instances.yml;
          done