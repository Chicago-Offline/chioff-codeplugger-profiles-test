name: Validate profiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profiles
        uses: actions/checkout@v4

      - name: Check out Codeplugger contract
        uses: actions/checkout@v4
        with:
          repository: Chicago-Offline/codeplugger
          ref: f2d262cbff8edbd0c2e080459809a871b1b06857
          path: codeplugger

      - name: Check out SSRF-Lite
        uses: actions/checkout@v4
        with:
          repository: Chicago-Offline/ssrf-lite
          path: ssrf-lite

      - name: Check out reference overlay
        uses: actions/checkout@v4
        with:
          repository: Chicago-Offline/chioff-ssrf-test
          path: chioff-ssrf-test

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Codeplugger
        run: uv sync --directory codeplugger --locked

      - name: Validate DM-32 reference profile
        run: >-
          codeplugger/.venv/bin/codeplugger-profile
          profiles/baofeng_dm32/reference.yml
          --ssrf-root ssrf-lite/ssrf
          --ssrf-root chioff-ssrf-test/ssrf
          --radio-root codeplugger/radios

      - name: Generate DM-32 qdmr YAML
        run: >-
          codeplugger/.venv/bin/codeplugger-profile
          profiles/baofeng_dm32/reference.yml
          --ssrf-root ssrf-lite/ssrf
          --ssrf-root chioff-ssrf-test/ssrf
          --radio-root codeplugger/radios
          --output-format qdmr-yaml
          > "$RUNNER_TEMP/dm32-reference.yaml"

      - name: Check generated DM-32 qdmr YAML
        run: >-
          codeplugger/.venv/bin/python -c
          'from pathlib import Path; import yaml;
          document = yaml.safe_load(Path("${{ runner.temp }}/dm32-reference.yaml").read_text());
          assert document["channels"] and document["zones"]'

      - name: Upload generated DM-32 qdmr YAML
        uses: actions/upload-artifact@v4
        with:
          name: dm32-reference-qdmr-yaml
          path: ${{ runner.temp }}/dm32-reference.yaml
          retention-days: 1

      - name: Validate UV-5R Mini reference profile
        run: >-
          codeplugger/.venv/bin/codeplugger-profile
          profiles/baofeng_uv5r_mini/reference.yml
          --ssrf-root ssrf-lite/ssrf
          --ssrf-root chioff-ssrf-test/ssrf
          --radio-root codeplugger/radios

      - name: Generate UV-5R Mini CHIRP CSV
        run: >-
          codeplugger/.venv/bin/codeplugger-profile
          profiles/baofeng_uv5r_mini/reference.yml
          --ssrf-root ssrf-lite/ssrf
          --ssrf-root chioff-ssrf-test/ssrf
          --radio-root codeplugger/radios
          --output-format chirp-csv
          > "$RUNNER_TEMP/uv5r-mini-reference.csv"

      - name: Check generated UV-5R Mini CHIRP CSV
        run: >-
          codeplugger/.venv/bin/python -c
          'from pathlib import Path;
          lines = Path("${{ runner.temp }}/uv5r-mini-reference.csv").read_text().splitlines();
          assert lines[0].startswith("Location,Name,Frequency");
          assert len(lines) > 1'

      - name: Upload generated UV-5R Mini CHIRP CSV
        uses: actions/upload-artifact@v4
        with:
          name: uv5r-mini-reference-chirp-csv
          path: ${{ runner.temp }}/uv5r-mini-reference.csv
          retention-days: 1

      - name: Check UV-5R Mini rejects DMR (unsupported mode)
        run: |
          set +e
          output=$(codeplugger/.venv/bin/codeplugger-profile \
            profiles/baofeng_uv5r_mini/negative-dmr.yml \
            --ssrf-root ssrf-lite/ssrf \
            --ssrf-root chioff-ssrf-test/ssrf \
            --radio-root codeplugger/radios 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::expected UV-5R Mini + DMR assignment to fail validation, but it succeeded"
            exit 1
          fi
          if ! echo "$output" | grep -q "does not support"; then
            echo "::error::expected an explicit unsupported-mode error, got: $output"
            exit 1
          fi
